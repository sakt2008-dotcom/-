<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0630"/>
      <stop offset="50%" stop-color="#3B1263"/>
      <stop offset="100%" stop-color="#120422"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B1263" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border & inner glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="200" r="180" fill="url(#glow)"/>
  
  <!-- Luxury Monogram "A" -->
  <text x="256" y="320" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="240" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))">A</text>
  
  <!-- Secondary Arabic text "أماسا" -->
  <text x="256" y="420" font-family="'Tajawal', system-ui, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">AMASA أماسا</text>
  
  <!-- Sparkles -->
  <path d="M 390 130 Q 390 150 410 150 Q 390 150 390 170 Q 390 150 370 150 Q 390 150 390 130 Z" fill="url(#gold)"/>
  <path d="M 120 180 Q 120 195 135 195 Q 120 195 120 210 Q 120 195 105 195 Q 120 195 120 180 Z" fill="url(#gold)"/>
</svg>
